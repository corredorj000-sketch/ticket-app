version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate

    build:
      commands:
        - env | grep '^DATABASE_URL=' >> .env.production
        - env | grep '^NEXTAUTH_SECRET=' >> .env.production
        - env | grep '^NEXTAUTH_URL=' >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*