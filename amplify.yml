version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate

    build:
      commands:
        - env | grep '^DATABASE_URL=' >> .env.production
        - env | grep '^NEXTAUTH_SECRET=' >> .env.production
        - env | grep '^NEXTAUTH_URL=' >> .env.production
        - env | grep '^RESEND_API_KEY=' >> .env.production
        - env | grep '^RESEND_FROM_EMAIL=' >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*